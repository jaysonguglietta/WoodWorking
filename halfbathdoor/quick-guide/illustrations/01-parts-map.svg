<rect x="370" y="145" width="440" height="235" fill="#F4F0E8" stroke="#2E6F73" stroke-width="3"/>
<text x="388" y="171" fill="#173A56" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" dominant-baseline="middle">Frame parts</text>
<text x="394" y="203" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle">• D-101A/B: 4-1/2 x 79 stiles</text>
<text x="394" y="233" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle">• D-101C/M/E: 4 x 15 rails</text>
<text x="394" y="263" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle">• D-101D: 7 x 15 lock rail</text>
<text x="394" y="293" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle">• D-101F: 12 x 15 bottom rail</text>
<text x="394" y="323" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle">• D-101G: 3 x 11 muntin</text>
<rect x="370" y="410" width="440" height="250" fill="#F4F0E8" stroke="#2E6F73" stroke-width="3"/>
<text x="388" y="436" fill="#173A56" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" dominant-baseline="middle">Floating panels</text>
<text x="394" y="468" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle">• D-101H/J/N: 15-3/4 wide</text>
<text x="394" y="498" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle">• D-101K/L: 6-7/8 wide</text>
<text x="394" y="528" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle">• All panel grain runs vertically</text>
<text x="394" y="558" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle">• Panel tongues are never glued</text>
<rect x="850" y="145" width="555" height="515" fill="#F4F0E8" stroke="#2E6F73" stroke-width="3"/>
<text x="868" y="171" fill="#173A56" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" dominant-baseline="middle">Mark before assembly</text>
<text x="874" y="203" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle">• Show face on every frame member</text>
<text x="874" y="233" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle">• Reference face and reference edge</text>
<text x="874" y="263" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle">• Top and bottom of both stiles</text>
<text x="874" y="293" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle">• Top/reference edge of every rail</text>
<text x="874" y="323" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle">• Joint IDs at each rail end</text>
<text x="874" y="353" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle">• Panel ID on the back face</text>
<text x="874" y="383" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle">• Pair D-101K and D-101L visually</text>
<text x="874" y="413" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle">• Keep all show faces upward on bench</text>
