<text x="394" y="212" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• D-101A/B: 4-1/4 x 80-1/2 equal stiles</text>
<text x="394" y="246" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• D-101C/M/E: 4 x 15-1/4 rails</text>
<text x="394" y="280" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• D-101D: 7 x 15-1/4 lock rail</text>
<text x="394" y="314" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• D-101F: 12 x 15-1/4 bottom rail</text>
<text x="394" y="348" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• D-101G: 3 x 11 muntin</text>
<text x="394" y="382" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Frame section: 1/4 + 7/8 + 1/4</text>
<rect x="370" y="425" width="440" height="250" fill="#F4F0E8" stroke="#2E6F73" stroke-width="3"/>
<text x="388" y="454" fill="#173A56" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="middle">Floating panels</text>
<text x="394" y="492" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• H: 15-7/8 W x 15-1/16 L</text>
<text x="394" y="526" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• J: 15-7/8 W x 15-9/16 L</text>
<text x="394" y="560" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• N: 15-7/8 W x 10-5/16 L</text>
<text x="394" y="594" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• K/L: 6-7/8 W x 11-13/16 L</text>
<text x="394" y="628" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• All panel grain runs vertically</text>
<rect x="850" y="145" width="555" height="515" fill="#F4F0E8" stroke="#2E6F73" stroke-width="3"/>
<text x="868" y="174" fill="#173A56" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="middle">Mark before assembly</text>
<text x="874" y="212" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Show face on every frame member</text>
<text x="874" y="246" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Reference face and reference edge</text>
<text x="874" y="280" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Top and bottom of both stiles</text>
<text x="874" y="314" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Top/reference edge of every rail</text>
<text x="874" y="348" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Joint IDs at each rail end</text>
<text x="874" y="382" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Panel ID on the back face</text>
<text x="874" y="416" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Pair D-101K and D-101L visually</text>
<text x="874" y="450" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Keep all show faces upward on bench</text>
