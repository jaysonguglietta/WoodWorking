<text x="968" y="430" fill="#173A56" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="start" dominant-baseline="middle">Fit and fastening</text>
<text x="974" y="468" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start" dominant-baseline="middle">• Dry-fit head stop first; sides butt below</text>
<text x="974" y="506" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start" dominant-baseline="middle">• Stop bears through removable paper shims</text>
<text x="974" y="544" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start" dominant-baseline="middle">• Calculate driven-axis layer stack</text>
<text x="974" y="582" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start" dominant-baseline="middle">• Prove length + angle on matching offcut</text>
<text x="974" y="620" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start" dominant-baseline="middle">• Permanent stop installs last</text>
<text x="974" y="658" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start" dominant-baseline="middle">• No glue to jamb, wall, floor, or plaster</text>
<rect x="950" y="765" width="580" height="155" fill="#FAEFEC" stroke="#A33B32" stroke-width="3"/>
<text x="980" y="805" fill="#A33B32" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start" dominant-baseline="middle">SUBSTRATE HOLD</text>
<text x="980" y="855" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start" dominant-baseline="middle">Hold for unknown layers, framing, utilities, or hazards.</text>
<text x="980" y="895" fill="#173A56" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="middle">No field drive until offcut embedment proof passes.</text>
