<text x="1070" y="515" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="middle">Shooting board or fine hand plane</text>
<rect x="1010" y="610" width="410" height="220" fill="#F4F0E8" stroke="#2E6F73" stroke-width="3"/>
<text x="1028" y="639" fill="#173A56" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="middle">Release</text>
<text x="1034" y="677" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Head level &lt;= 1/16</text>
<text x="1034" y="711" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Reveal within 1/32</text>
<text x="1034" y="745" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Gap &lt; 0.010</text>
<text x="1034" y="779" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Faces flush &lt;= 0.010</text>
</svg>
