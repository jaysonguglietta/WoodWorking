<text x="120" y="910" fill="#A33B32" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="middle">STOP when projection &gt; 1/8 in or substrate damage prevents full bearing - repair the condition first.</text>
