<text x="79" y="349" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• STOP: &gt;= 3/4 sound jamb</text>
<text x="79" y="383" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Offset rows; avoid corners</text>
<rect x="1015" y="180" width="405" height="340" fill="#F4F0E8" stroke="#2E6F73" stroke-width="3"/>
<text x="1033" y="209" fill="#173A56" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="middle">Typical spacing</text>
<text x="1039" y="247" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Inner casing: 12-16 in OC</text>
<text x="1039" y="281" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Outer casing: about 16 in OC</text>
<text x="1039" y="315" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Backband: 8-12 in OC</text>
<text x="1039" y="349" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• No band point exit or split</text>
<text x="1039" y="383" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Cycle door before stop pattern</text>
