<text x="1080" y="610" fill="#173A56" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle">Then rip supported strips to 1-1/4 in</text>
<text x="1080" y="760" fill="#A33B32" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle" dominant-baseline="middle">Never plane a loose 1-1/4 x 3/8 strip.</text>
<text x="85" y="825" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="middle">Use infeed/outfeed support, guards, extraction, push blocks, and a zero-clearance strategy suited to the machine.</text>
