<rect x="70" y="690" width="590" height="200" fill="#F4F0E8" stroke="#2E6F73" stroke-width="3"/>
<text x="88" y="719" fill="#173A56" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="middle">Bearing rule</text>
<text x="94" y="757" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Casing back lies flat on jamb + wall</text>
<text x="94" y="791" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Relieve a locally proud jamb only</text>
<text x="94" y="825" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Shim a recessed jamb continuously</text>
<text x="94" y="859" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Preserve at least 1/2 in sound casing</text>
<rect x="760" y="690" width="660" height="200" fill="#F4F0E8" stroke="#2E6F73" stroke-width="3"/>
<text x="778" y="719" fill="#173A56" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="middle">Glue and fastener boundary</text>
<text x="784" y="757" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Glue casing-to-casing and band-to-casing only</text>
<text x="784" y="791" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Never glue natural-finish trim to drywall</text>
<text x="784" y="825" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Inner brads enter jamb; outer nails enter framing</text>
<text x="784" y="859" fill="#20272D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="middle">• Verify utilities and substrate before fastening</text>
